[package]
name = "relay-benches"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "lib.rs"

[features]
# Evaluation-only audio-processing candidates; never part of the product build.
sonora = ["relay-audio/eval-sonora"]
nnnoiseless = ["relay-audio/eval-nnnoiseless"]
# Pure-Rust ONNX candidates (GTCRN, DTLN); weights live in benches/models (untracked).
neural = ["dep:tract-onnx", "dep:realfft"]

[dependencies]
relay-audio.workspace = true
cpu-time.workspace = true
hound.workspace = true
claxon.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tract-onnx = { workspace = true, optional = true }
realfft = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
relay-protocol.workspace = true
relay-testkit.workspace = true
tempfile.workspace = true

[[bench]]
name = "jitter"
path = "protocol/jitter.rs"
harness = false

[[bench]]
name = "audio_stages"
path = "audio/stages.rs"
harness = false

[[bin]]
name = "audio-corpus"
path = "audio/main.rs"

[lints]
workspace = true
