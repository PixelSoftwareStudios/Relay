# nfpm builds the .deb and .rpm from the staged tree (scripts/packaging/linux.sh).
# ARCH (amd64|arm64), VERSION and STAGE come from the environment.
name: relay
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: sound
priority: optional
maintainer: Relay maintainers <noreply@users.noreply.github.com>
description: |
  Voice calls on your local network.
  Relay is a peer-to-peer voice app: the relayd engine, the relay terminal client and the
  relay-desktop window.
homepage: https://github.com/PixelSoftwareStudios/Relay
license: Apache-2.0
contents:
  - src: ${STAGE}/usr/bin/relayd
    dst: /usr/bin/relayd
  - src: ${STAGE}/usr/bin/relay
    dst: /usr/bin/relay
  - src: ${STAGE}/usr/bin/relay-desktop
    dst: /usr/bin/relay-desktop
  - src: ${STAGE}/usr/share/applications/relay.desktop
    dst: /usr/share/applications/relay.desktop
  - src: ${STAGE}/usr/share/icons/hicolor/256x256/apps/relay.png
    dst: /usr/share/icons/hicolor/256x256/apps/relay.png
  - src: ${STAGE}/usr/share/icons/hicolor/512x512/apps/relay.png
    dst: /usr/share/icons/hicolor/512x512/apps/relay.png
  - src: ${STAGE}/usr/share/doc/relay/
    dst: /usr/share/doc/relay/
    type: tree
overrides:
  deb:
    depends:
      - libasound2t64 | libasound2
      - libgtk-3-0t64 | libgtk-3-0
      - libxkbcommon0
      - libayatana-appindicator3-1
  rpm:
    depends:
      - alsa-lib
      - gtk3
      - libxkbcommon
      - libayatana-appindicator-gtk3
