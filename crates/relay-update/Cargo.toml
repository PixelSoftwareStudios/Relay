[package]
name = "relay-update"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Signed self-update for the Relay desktop app: check, download, verify and replace in place"

[features]
# Lets tests point the updater at a local plain-HTTP server. Never enabled by a dependent crate:
# the production constructor ignores it and no environment variable or setting reaches the endpoint.
test-util = []

[dependencies]
ureq.workspace = true
minisign-verify.workspace = true
semver.workspace = true
zip.workspace = true
flate2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile.workspace = true
sha2.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
relay-update = { path = ".", features = ["test-util"] }
ed25519-dalek.workspace = true
blake2.workspace = true
base64.workspace = true
hex.workspace = true

[lints]
workspace = true
