syntax = "proto3";
package relay.peer.v1;

import "relay/peer/v1/channel.proto";

// Bounded messages INSIDE authenticated reliable peer-control records.
// Not a remote gRPC service. Never expose local Engine RPCs to LAN peers.
message Envelope {
  bytes message_id = 1; // exactly 16; semantic operation identity
  uint32 protocol_major = 15;
  bytes reply_to_message_id = 16; // optional semantic correlation, empty or 16 bytes
  oneof body {
    Hello hello = 2;
    Invite invite = 3;
    Ringing ringing = 4;
    Accept accept = 5;
    Reject reject = 6;
    End end = 7;
    Keepalive keepalive = 8;
    EndpointOffer endpoint_offer = 9;
    Profile profile = 10;
    AvatarRequest avatar_request = 11;
    AvatarChunk avatar_chunk = 12;
    EpochSwitch epoch_switch = 13;
    Error error = 14;
    MediaReady media_ready = 17;
    MediaFeedback media_feedback = 18;
    StreamState stream_state = 19;
    ChannelMessage channel = 20; // named-channel proof and join; never reaches call state
    SessionMessage session_message = 21; // call-scoped chat, offers, transfer control; see docs/session-messages.md
  }
}
message Hello {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  bytes public_key_sha256 = 3; // must equal authenticated static-key digest
  string display_name = 4;
  repeated string media_profiles = 5;
  uint32 max_parallel_calls = 6;
  bytes engine_incarnation = 7; // exactly 16; restart is not a resumable old engine
}
message Invite { bytes call_id = 1; repeated string offered_profiles = 2; uint32 ring_timeout_ms = 3; bool allow_parallel_same_peer = 4; }
message Ringing { bytes call_id = 1; }
message Accept {
  bytes call_id = 1;
  string selected_profile = 2;
  uint32 send_ssrc = 3;
  uint32 initial_stream_generation = 4;
  // Acceptance is not local microphone consent on either machine.
}
message Reject { bytes call_id = 1; string reason_code = 2; }
message End { bytes call_id = 1; string reason_code = 2; }
message Keepalive { uint64 nonce = 1; bool reply = 2; }
message Endpoint {
  bytes ip_address = 1; // exactly 4 or 16
  uint32 port = 2;
  uint32 ipv6_scope_id = 3; // local interpretation; never blindly trust remote indexes
}
message EndpointOffer { bytes link_epoch = 1; repeated Endpoint candidates = 2; }
message Profile { string display_name = 1; bytes avatar_sha256 = 2; uint32 avatar_size = 3; }
message AvatarRequest { bytes avatar_sha256 = 1; }
message AvatarChunk {
  bytes avatar_sha256 = 1;
  uint32 offset = 2;
  uint32 total_size = 3;
  bytes data = 4; // <=8192; transfer totals <=1MiB; bytes are one canonical lossless WebP
  bool final_chunk = 5;
}
message EpochSwitch {
  bytes previous_epoch = 1;
  bytes next_epoch = 2;
  repeated bytes active_call_ids = 3;
  bool acknowledge = 4;
}
message Error { string code = 1; bytes call_id = 2; }

message MediaReady {
  bytes call_id = 1;
  string selected_profile = 2;
  uint32 send_ssrc = 3;
  uint32 send_stream_generation = 4;
  bytes link_epoch = 5;
}
message MediaFeedback {
  bytes call_id = 1;
  uint32 stream_generation = 2;
  uint64 received = 3;
  uint64 missing_at_deadline = 4;
  uint64 late = 5;
  uint32 playout_target_us = 6;
  string overload_code = 7;
}
message StreamState {
  bytes call_id = 1;
  uint32 stream_generation = 2;
  bool sender_gate_open = 3;
  uint32 next_media_timestamp = 4;
  // Advisory state only. Never grants local mic authority or blocks media playout.
}

// Session messaging (docs/session-messages.md). Carried on the control lane, bounded by
// control::session_msg::validate and never interpreted by call state. Unknown fields are
// ignored by the decoder; unknown oneof members and unknown enum values are refused.
message SessionMessage {
  oneof body {
    ChatMessage message = 1;
    ChatAck ack = 2;
    FileOffer offer = 3;
    OfferResponse offer_response = 4;
    PreviewRequest preview_request = 5;
    PreviewReply preview_reply = 6;
    TransferControl transfer = 7;
    PermissionUpdate permissions = 8;
  }
}
message ChatMessage {            // seq is the sender's per-session counter, starts at 1
  uint64 seq = 1;
  uint64 sent_at_unix_ms = 2;    // untrusted claim, display only
  oneof content {
    string text = 3;             // 1..=4096 bytes
    ChatImage image = 4;
  }
}
// Original compressed bytes; the receiver validates the image header. A control record is at
// most 16 KiB, so inline images are limited to 15 KiB; larger images travel as file offers.
message ChatImage { bytes data = 1; }
message ChatAck {
  enum Status { DELIVERED = 0; DISABLED = 1; TOO_LARGE = 2; INVALID = 3; RATE_LIMITED = 4;
                HISTORY_FULL = 5; UNSUPPORTED = 6; ENDED = 7; }
  uint64 seq = 1;
  Status status = 2;
}
message FileOffer {
  uint64 seq = 1;                // offers are numbered like messages
  uint64 sent_at_unix_ms = 2;
  bytes offer_id = 3;            // exactly 16
  string name = 4;               // 1..=255 bytes; the receiver re-sanitizes
  uint64 size = 5;               // <= 4 GiB
  string media_type = 6;         // advisory, <= 127 bytes; the receiver derives its own
  bytes blake3 = 7;              // exactly 32
}
message OfferResponse { bytes offer_id = 1; bool accepted = 2; string reason = 3; } // reason <= 64 bytes
message PreviewRequest { bytes offer_id = 1; }
message PreviewReply { bytes offer_id = 1; bool approved = 2; string text = 3; }   // text <= 15 KiB
// Transfer control. File bytes, credit, completion and the verification result travel on the
// per-transfer data link (docs/net.md), not here: TCP backpressure replaces the draft's
// credit_up_to and done operations on this link.
message TransferControl {
  bytes offer_id = 1;            // exactly 16
  oneof op {
    DataLinkGrant data_link = 2; // listener tells the dialer how to open the data link
    TransferResult result = 3;   // receiver: verification outcome (also sent on the data link)
    CancelReason cancel = 4;     // either side; closes the data link
  }
}
// One-time authorisation for exactly one data link. The address is the control link's remote
// address (never carried here, so a peer cannot redirect the dial); only the port travels.
message DataLinkGrant {
  bytes token = 1;               // exactly 32 random bytes, single use
  uint32 port = 2;               // 1..=65535
  uint32 ttl_ms = 3;             // advisory validity, 1..=120000
}
enum TransferResult { RESULT_OK = 0; RESULT_HASH_MISMATCH = 1; RESULT_SIZE_MISMATCH = 2; RESULT_FAILED = 3; }
enum CancelReason { CANCEL_USER = 0; CANCEL_DISABLED = 1; CANCEL_ERROR = 2; }
message PermissionUpdate { bool allow_messages = 1; bool allow_files = 2; }  // host to guest
