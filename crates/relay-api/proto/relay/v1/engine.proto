syntax = "proto3";
package relay.v1;

// Design contract, not generated/compiled application code.
// Transport authenticates the OS user first. Client IDs are not credentials.
// All IDs below are validated opaque bytes: 16 bytes except peer_id (32).
// Every mutation is authorized and converted to domain types before execution.
service Engine {
  rpc GetInfo(Empty) returns (EngineInfo);
  rpc RegisterClient(RegisterClientRequest) returns (ClientSession);
  rpc GetSnapshot(ClientContext) returns (Snapshot);
  rpc WatchState(WatchStateRequest) returns (stream StateEnvelope);
  rpc WatchTelemetry(TelemetryRequest) returns (stream TelemetrySnapshot);
  rpc GetOperation(GetOperationRequest) returns (Operation);
  rpc StartCall(StartCallRequest) returns (Operation);
  rpc AcceptCall(CallMutation) returns (Operation);
  rpc DeclineCall(CallMutation) returns (Operation);
  rpc EndCall(CallMutation) returns (Operation);
  rpc AcquireController(AcquireControllerRequest) returns (ControllerLease);
  rpc ReleaseController(ReleaseControllerRequest) returns (Operation);
  // The one atomic microphone control of a call: mode is also the consent (MUTED withdraws it).
  rpc SetTransmitMode(SetTransmitModeRequest) returns (Operation);
  rpc SetCallControls(SetCallControlsRequest) returns (Operation);
  rpc SetGlobalControls(SetGlobalControlsRequest) returns (Operation);
  rpc SelectDevices(SelectDevicesRequest) returns (Operation);
  rpc SetNoiseSuppression(SetNoiseSuppressionRequest) returns (Operation);
  rpc StartMicTest(StartMicTestRequest) returns (Operation);
  rpc StopMicTest(MutationContext) returns (Operation);
  rpc PreviewTone(MutationContext) returns (Operation); // plays the ring on this device's own output for 2 s
  rpc SetProfile(SetProfileRequest) returns (Operation);
  rpc UploadAvatar(UploadAvatarRequest) returns (Operation);
  // Removes the local avatar and tells trusted peers (a Profile with an empty avatar hash).
  rpc ClearAvatar(MutationContext) returns (Operation);
  rpc DecidePeerTrust(DecidePeerTrustRequest) returns (Operation);
  // Dials a scanned `relay://host:port#fingerprint` string and, when the authenticated static key
  // matches the scanned fingerprint, trusts the peer as VERIFIED (out of band). A mismatch or an
  // unreachable address FAILS the operation and stores nothing. Needs `call-control`.
  rpc ConnectAndTrust(ConnectAndTrustRequest) returns (Operation);
  // Live measurements of one call at 1 Hz (docs/engine.md). Needs `observe`.
  rpc WatchCallStats(WatchCallStatsRequest) returns (stream CallStats);
  // Removes a stored trust decision, found by peer id, fingerprint prefix or exact name.
  rpc ForgetPeer(ForgetPeerRequest) returns (Operation);
  // Replaces the favorites by this ordered list of trusted peers (docs/engine.md). More than 6,
  // a repeated or an untrusted peer FAILS the operation and changes nothing. Needs `call-control`.
  rpc SetFavorites(SetFavoritesRequest) returns (Operation);
  rpc CreateChannel(CreateChannelRequest) returns (Operation);
  rpc JoinChannel(JoinChannelRequest) returns (Operation);
  rpc LeaveChannel(LeaveChannelRequest) returns (Operation);
  rpc ListChannels(ListChannelsRequest) returns (ListChannelsResponse);
  rpc CreateInvite(CreateInviteRequest) returns (CreateInviteResponse);
  rpc RevokeChannelMember(RevokeChannelMemberRequest) returns (Operation);
  rpc SetPrivacy(SetPrivacyRequest) returns (Operation);
  rpc GetAvatar(GetAvatarRequest) returns (AvatarImage);
  rpc GetConnectionInfo(ClientContext) returns (ConnectionInfo);
  // Every preference as flat `section.key` text (for export). Needs `observe`.
  rpc GetSettings(ClientContext) returns (SettingsDump);
  // Changes any non-sensitive preference while the daemon runs; answers per key. Needs
  // `call-control`; a security-sensitive key makes the whole call PERMISSION_DENIED.
  rpc SetSettings(SetSettingsRequest) returns (SetSettingsResponse);
  // Graceful stop of the whole engine: ends calls, releases the microphone, removes the
  // endpoint. Needs the explicit `admin` capability (never granted by default). Idempotent.
  rpc Shutdown(MutationContext) returns (Operation);
  // Call history (local only, never sent to peers). Needs `observe`; clearing needs `call-control`.
  // Newest first; `before_id` continues after the last id of the previous page.
  rpc ListCallHistory(ListCallHistoryRequest) returns (CallHistoryPage);
  rpc ClearCallHistory(MutationContext) returns (Operation);
  // Session messaging (docs/session-messages.md). Every method below, reads included, needs the
  // `messages` capability: without it the answer is PERMISSION_DENIED and no event is ever
  // delivered. Messaging operations are applied synchronously: the answer is final and
  // GetOperation does not track them.
  rpc ListSessions(ClientContext) returns (ListSessionsResponse);
  rpc GetTranscript(GetTranscriptRequest) returns (Transcript);
  rpc WatchSession(WatchSessionRequest) returns (stream SessionEnvelope);
  rpc SendSessionMessage(SendSessionMessageRequest) returns (SessionOpResult);
  rpc SendSessionImage(SendSessionImageRequest) returns (SessionOpResult);
  rpc RetrySessionMessage(RetrySessionMessageRequest) returns (SessionOpResult);
  rpc OfferFile(OfferFileRequest) returns (SessionOpResult);
  rpc RespondOffer(RespondOfferRequest) returns (SessionOpResult);
  rpc RequestPreview(OfferRequest) returns (SessionOpResult);
  rpc ApprovePreview(ApprovePreviewRequest) returns (SessionOpResult);
  rpc CancelTransfer(OfferRequest) returns (SessionOpResult);
  rpc SetSessionPermissions(SetSessionPermissionsRequest) returns (SessionOpResult);
  rpc PinMessage(PinMessageRequest) returns (SessionOpResult);
  rpc SearchSession(SearchSessionRequest) returns (SearchSessionResponse);
  rpc ClearSession(ClearSessionRequest) returns (SessionOpResult);
  rpc ExportSession(ExportSessionRequest) returns (ExportSessionResponse);
  rpc SetMessagingSettings(SetMessagingSettingsRequest) returns (SessionOpResult);
  rpc InputControl(stream InputControlMessage) returns (stream InputControlAck);
  // Start-up of the background service (docs/api.md). These three need no registered client:
  // they are what a client can do while the service waits for the system's secure storage
  // (keychain prompt) or after that failed. All answer with the fresh EngineInfo.
  // Reads the secure storage again after a failure.
  rpc RetryKeychain(Empty) returns (EngineInfo);
  // Chooses the file-backed store (less secure) for identity and channel secrets, then retries.
  // Never done by itself: only on this explicit request.
  rpc UseFileStore(Empty) returns (EngineInfo);
  // Deletes the stored identity so the next start creates a new one; contacts must re-verify.
  // The service stops afterwards. The caller must have confirmed with the user.
  rpc ResetIdentity(Empty) returns (EngineInfo);
}

message Empty {}
message ClientContext {
  bytes client_id = 1;
  bytes engine_incarnation = 2;
}
message MutationContext {
  ClientContext client = 1;
  bytes operation_id = 2;
  optional uint64 expected_revision = 3;
}
message EngineInfo {
  bytes engine_incarnation = 1;
  string application_version = 2;
  uint32 api_major = 3;
  uint32 api_minor = 4;
  repeated string capabilities = 5;
  ResourceLimits limits = 6;
  string build_revision = 7; // git commit of the daemon build, or "<version>-dev"
  uint32 api_revision = 8; // bumped when the API changes in a way clients depend on
  Startup startup = 9; // absent or READY once the service is fully running
}
enum StartupState {
  STARTUP_STATE_READY = 0;
  STARTUP_STATE_STARTING = 1; // identity and secrets are being opened; calls are not available yet
  STARTUP_STATE_FAILED = 2; // stays up and waits for RetryKeychain / UseFileStore / ResetIdentity
}
enum StartupReason {
  STARTUP_REASON_NONE = 0;
  STARTUP_REASON_WAITING_FOR_KEYCHAIN = 1; // the system may be asking the user for permission
  STARTUP_REASON_KEYCHAIN_UNAVAILABLE = 2; // denied, locked, interrupted or timed out
  STARTUP_REASON_IDENTITY_UNREADABLE = 3; // stored data is corrupt or from a newer version
}
message Startup {
  StartupState state = 1;
  StartupReason reason = 2;
  string detail = 3; // technical text from the system, for logs and "details"
}
message ResourceLimits {
  uint32 active_calls = 1;
  uint32 clients = 2;
  uint32 avatar_max_bytes = 3;
  uint32 meters_max_hz = 4;
  uint32 ptt_lease_max_ms = 5;
}
message RegisterClientRequest {
  string display_name = 1; // bounded UTF-8; not a trusted identity
  string client_version = 2;
  uint32 api_major = 3;
  repeated string requested_capabilities = 4;
}
message ClientSession {
  ClientContext context = 1;
  repeated string granted_capabilities = 2;
  uint64 revision = 3;
  string daemon_build_revision = 4; // as EngineInfo.build_revision
  uint32 daemon_api_revision = 5; // as EngineInfo.api_revision
}
enum CallState {
  CALL_STATE_UNSPECIFIED = 0;
  CALL_STATE_OUTGOING_RINGING = 1;
  CALL_STATE_INCOMING_RINGING = 2;
  CALL_STATE_NEGOTIATING = 3;
  CALL_STATE_CONNECTED = 4;
  CALL_STATE_INTERRUPTED = 5;
  CALL_STATE_ENDING = 6;
  CALL_STATE_ENDED = 7;
  CALL_STATE_FAILED = 8;
  CALL_STATE_PREPARING = 9;
  CALL_STATE_DECLINED = 10;
  CALL_STATE_CANCELLED = 11;
}
// Per-call microphone mode. UNMUTED (open mic) and PUSH_TO_TALK are the user's explicit
// consent to send the microphone to that call; MUTED withdraws it.
enum TransmitMode {
  TRANSMIT_MODE_UNSPECIFIED = 0;
  TRANSMIT_MODE_MUTED = 1;
  TRANSMIT_MODE_PUSH_TO_TALK = 2;
  TRANSMIT_MODE_UNMUTED = 3;
}
enum OperationState {
  OPERATION_STATE_UNSPECIFIED = 0;
  OPERATION_STATE_ACCEPTED = 1;
  OPERATION_STATE_APPLIED = 2;
  OPERATION_STATE_FAILED = 3;
}
enum TrustState {
  TRUST_STATE_UNSPECIFIED = 0;
  TRUST_STATE_UNKNOWN = 1;
  TRUST_STATE_TOFU_UNVERIFIED = 2;
  TRUST_STATE_VERIFIED = 3;
  TRUST_STATE_KEY_CHANGED = 4;
  TRUST_STATE_BLOCKED = 5;
}
enum DeviceDirection {
  DEVICE_DIRECTION_UNSPECIFIED = 0;
  DEVICE_DIRECTION_INPUT = 1;
  DEVICE_DIRECTION_OUTPUT = 2;
}
message Problem {
  string code = 1; // stable machine code, not a localized string
  string message = 2; // sanitized description
  bool retryable = 3;
  string recovery_action = 4;
}
message Operation {
  bytes operation_id = 1;
  OperationState state = 2;
  uint64 revision = 3;
  bytes call_id = 4;
  Problem problem = 5;
}
message GetOperationRequest { ClientContext client = 1; bytes operation_id = 2; }
message Peer {
  bytes peer_id = 1;
  string display_name = 2;
  repeated string local_addresses = 3;
  TrustState trust = 4;
  bool reachable = 5;
  bytes avatar_sha256 = 6;
  repeated bytes shared_channel_ids = 7; // only channels with proven shared membership
  string fingerprint_short = 8; // e.g. A1B2-C3D4-E5F6-0718-293A: a hint to tell devices apart, never a verification string
  uint32 port = 9; // peer listener port of the first local address, 0 when unknown
  uint64 last_seen_unix_ms = 10; // last time discovery or a link showed it; 0 when never
  // Favorites (the quick-call grid): at most 6 trusted peers in a user-chosen order.
  bool favorite = 20;
  uint32 favorite_position = 21; // 0-based place in the favorites; 0 and meaningless when not a favorite
}
message Device {
  string device_id = 1; // opaque adapter-qualified ID; never an enumeration index
  string name = 2;
  DeviceDirection direction = 3;
  bool available = 4;
  bool system_default = 5;
  repeated uint32 supported_rates_hint = 6;
}
message ControllerLease {
  bytes call_id = 1;
  bytes controller_client_id = 2;
  uint64 generation = 3;
  bytes lease_id = 4;
  uint32 expires_in_ms = 5;
}
message TransmitRoute {
  TransmitMode mode = 1;
  bool consent_granted = 2; // derived: mode is not MUTED
  bool effective_transmitting = 3;
  string blocked_reason = 4;
  uint64 generation = 5;
  bool authorized_background_open_mic = 6;
  bool releasing = 7; // key already up; the gate stays open until the release delay ends
}
message Call {
  bytes call_id = 1;
  bytes peer_id = 2;
  CallState state = 3;
  uint64 revision = 4;
  ControllerLease controller = 5;
  TransmitRoute transmit = 6;
  bool user_muted = 7;
  bool user_deafened = 8;
  float receive_gain = 9;
  string negotiated_profile = 10;
  Problem problem = 11;
  // Engine wall clock when the call became connected (path validated); 0 while not connected.
  // Show durations as now - connected_at_unix_ms so both ends and every client agree.
  uint64 connected_at_unix_ms = 12;
}
message Settings {
  uint64 revision = 1;
  string input_device_id = 2;
  string output_device_id = 3;
  string ns_backend_id = 4;
  bool global_muted = 5;
  bool global_deafened = 6;
  float microphone_gain = 7;
  float playback_gain = 8;
  string display_name = 9; // advertised local name
  bytes avatar_sha256 = 10; // empty when no avatar is set
  InboundPolicy inbound_policy = 11;
  AdvertMode advert_mode = 12;
  uint32 ptt_release_delay_ms = 13; // 0..=2000; gate hold after an ordinary key-up
  bool autostart_daemon = 14; // the desktop app starts/restarts the daemon by itself
  bool ringtone_enabled = 15; // ring for an incoming call while a client is attached
  float ringtone_volume = 16; // 0.0..=1.0
  bool ringback_enabled = 17; // ringback while an outgoing call rings
  bool call_sounds_enabled = 18; // connect and hang-up blips
  // What the engine uses, derived from the saved ids and the current device list. An empty
  // input_device_id / output_device_id means "follow the system default".
  bool input_is_default = 19; // no microphone is pinned
  bool output_is_default = 20; // no playback device is pinned
  string input_device_name = 21; // the microphone that is opened (empty when the system has none)
  string output_device_name = 22; // the playback device that is opened (empty when none)
  bool input_pinned_missing = 23; // the pinned microphone is absent; the system default is used
  bool output_pinned_missing = 24; // the pinned playback device is absent; the system default is used
  bool history_enabled = 25; // finished calls are recorded in the call history (history.enabled)
  uint64 history_revision = 26; // changes whenever an entry is added or the history is cleared; refetch then
  TransmitMode default_transmit_mode = 27; // calls.default_transmit_mode as saved
  TransmitMode effective_default_transmit_mode = 28; // what a new call gets (differs when ptt is off)
  bool ptt_enabled = 29; // ptt.enabled: push-to-talk may be chosen
  string daemon_build_revision = 30; // as EngineInfo.build_revision, so one snapshot shows a stale daemon
  uint32 daemon_api_revision = 31;
}
message Snapshot {
  bytes engine_incarnation = 1;
  uint64 revision = 2;
  repeated Peer peers = 3;
  repeated Call calls = 4;
  repeated Device devices = 5;
  Settings settings = 6;
  repeated Problem warnings = 7;
  repeated ChannelInfo channels = 8;
}
message WatchStateRequest {
  ClientContext client = 1;
  optional uint64 after_revision = 2;
  repeated bytes call_filter = 3;
  bool include_peers = 4;
}
message ResyncRequired { uint64 current_revision = 1; string reason = 2; }
message Removed { bytes id = 1; string kind = 2; }
message StateEvent {
  oneof event {
    Peer peer = 1;
    Call call = 2;
    Device device = 3;
    Settings settings = 4;
    Operation operation = 5;
    Removed removed = 6;
    Problem warning = 7;
    ChannelInfo channel = 8;
  }
}
message StateEnvelope {
  bytes engine_incarnation = 1;
  uint64 revision = 2;
  oneof body { Snapshot snapshot = 3; StateEvent event = 4; ResyncRequired resync = 5; }
}
message StartCallRequest {
  MutationContext context = 1;
  oneof target { bytes peer_id = 2; string manual_local_address = 3; string manual_connection_string = 5; }
  bool allow_parallel_same_peer = 4;
  // StartCall NEVER implicitly authorizes microphone transmission.
}
message CallMutation { MutationContext context = 1; bytes call_id = 2; uint64 controller_generation = 3; }
message AcquireControllerRequest {
  MutationContext context = 1;
  bytes call_id = 2;
  bool request_explicit_takeover = 3;
}
message ReleaseControllerRequest {
  MutationContext context = 1;
  bytes call_id = 2;
  bytes lease_id = 3;
  uint64 controller_generation = 4;
}
message SetTransmitModeRequest {
  MutationContext context = 1;
  bytes call_id = 2;
  uint64 controller_generation = 3;
  TransmitMode mode = 4; // UNMUTED / PUSH_TO_TALK are the consent; there is no separate flag
  bool authorize_background_open_mic = 5; // UNMUTED only
}
message ConnectAndTrustRequest {
  MutationContext context = 1;
  string connection_string = 2; // relay://host:port#fingerprint, as scanned from a QR code
}
message WatchCallStatsRequest { ClientContext client = 1; bytes call_id = 2; }
enum MediaPathState {
  MEDIA_PATH_STATE_UNSPECIFIED = 0;
  MEDIA_PATH_STATE_WAITING = 1; // waiting for the UDP path to be validated
  MEDIA_PATH_STATE_CONNECTED = 2;
  MEDIA_PATH_STATE_FAILED = 3; // see path_reason
}
// One call's live measurements, about once per second while it is connected. All estimates:
// see docs/engine.md for the formulas.
message CallStats {
  bytes call_id = 1;
  MediaPathState path_state = 2;
  string path_reason = 3; // why FAILED or still WAITING; empty when connected
  bool sending = 4; // a packet was sent in the last 500 ms
  bool receiving = 5; // a packet was received in the last 500 ms
  uint64 packets_sent = 6;
  uint64 packets_received = 7;
  optional float mic_level_dbfs = 8; // while the microphone is open
  optional double rtt_ms = 9; // smoothed round trip on the media path
  optional double rtt_min_ms = 10; // over the last 10 s
  optional double rtt_max_ms = 11;
  optional double jitter_ms = 12; // RFC 3550 interarrival jitter
  double loss_percent_5s = 13;
  double loss_percent_total = 14;
  double jitter_buffer_target_ms = 15;
  double jitter_buffer_depth_ms = 16;
  double playout_delay_ms = 17;
  optional double mouth_to_ear_ms = 18; // estimate
  uint32 codec_bitrate_bps = 19;
  uint32 packet_bytes = 20; // typical sealed packet size
  string local_addr = 21;
  string remote_addr = 22;
  string transport = 23; // "lan" or "overlay"
  optional double clock_drift_ppm = 24;
  uint32 capture_buffer_frames = 25;
  double capture_buffer_ms = 26;
  uint32 playback_buffer_frames = 27;
  double playback_buffer_ms = 28;
}
message SetCallControlsRequest {
  MutationContext context = 1;
  bytes call_id = 2;
  uint64 controller_generation = 3;
  optional bool muted = 4;
  optional bool deafened = 5;
  optional float receive_gain = 6; // finite, engine-clamped
}
message SetGlobalControlsRequest {
  MutationContext context = 1;
  optional bool muted = 2;
  optional bool deafened = 3;
  optional float microphone_gain = 4;
  optional float playback_gain = 5;
  optional uint32 ptt_release_delay_ms = 6; // 0..=2000, applies live and is persisted
  optional bool autostart_daemon = 7; // persisted; read by the desktop app
  optional bool ringtone_enabled = 8; // persisted; disabling stops a ring that plays
  optional float ringtone_volume = 9; // 0.0..=1.0, persisted, applies to a playing ring at once
  optional bool ringback_enabled = 10; // persisted
  optional bool call_sounds_enabled = 11; // persisted
}
message SelectDevicesRequest { MutationContext context = 1; string input_device_id = 2; string output_device_id = 3; }
message SetNoiseSuppressionRequest { MutationContext context = 1; string qualified_backend_id = 2; }
message StartMicTestRequest {
  MutationContext context = 1;
  bool local_playback = 2;
  bool confirmed_feedback_warning = 3;
}
message SetProfileRequest { MutationContext context = 1; string display_name = 2; }
message UploadAvatarRequest {
  MutationContext context = 1;
  bytes encoded_image = 2; // bounded <=1MiB, any of PNG/JPEG/WebP/GIF/BMP/TIFF, not a local path or raw pixel array
  string declared_media_type = 3; // do not trust without decoding validation
}
message DecidePeerTrustRequest {
  MutationContext context = 1;
  bytes peer_id = 2;
  bytes expected_public_key_sha256 = 3;
  TrustState requested_trust = 4;
  bool out_of_band_verified = 5;
}
message ForgetPeerRequest {
  MutationContext context = 1;
  bytes peer_id = 2; // 32 bytes; when empty `query` is used
  string query = 3; // hex fingerprint prefix (>= 8 digits, separators ignored) or an exact display name
}
enum CallDirection {
  CALL_DIRECTION_UNSPECIFIED = 0;
  CALL_DIRECTION_INCOMING = 1;
  CALL_DIRECTION_OUTGOING = 2;
}
enum CallOutcome {
  CALL_OUTCOME_UNSPECIFIED = 0;
  CALL_OUTCOME_COMPLETED = 1; // connected, then ended
  CALL_OUTCOME_MISSED = 2;    // incoming, never answered
  CALL_OUTCOME_DECLINED = 3;  // declined by either side
  CALL_OUTCOME_FAILED = 4;    // outgoing, never reached the peer or never connected
  CALL_OUTCOME_CANCELLED = 5; // outgoing, cancelled by the user before it connected
}
// One past call. Metadata only: no audio, no message content, no addresses.
message CallHistoryEntry {
  uint64 id = 1;                      // grows with every entry; the paging cursor
  bytes call_id = 2;                  // 16 bytes; names the call's chat session
  string peer_name = 3;               // as seen at the time
  bytes peer_id = 4;                  // 32 bytes; the full fingerprint
  string peer_fingerprint_short = 5;  // same hint as Peer.fingerprint_short
  CallDirection direction = 6;
  CallOutcome outcome = 7;
  uint64 started_at_unix_ms = 8;
  uint64 duration_ms = 9;             // connected time; 0 when it never connected
}
message ListCallHistoryRequest {
  ClientContext client = 1;
  uint32 limit = 2;                   // 0 = engine default; capped by the engine
  optional uint64 before_id = 3;
}
message CallHistoryPage {
  repeated CallHistoryEntry entries = 1;
  bool more = 2;                      // older entries exist
  uint64 revision = 3;                // Settings.history_revision at read time
}
message SettingsDump {
  string build_revision = 3; // as EngineInfo.build_revision
  uint32 api_revision = 4; // as EngineInfo.api_revision
  map<string, string> values = 1;
  // Bytes in use next to the limit that bounds them, keyed by that limit's preference key
  // (limits.avatar_cache_mib, limits.messages_retained_mib, limits.messages_session_mib).
  // A limit whose usage the engine does not know cheaply has no entry.
  map<string, uint64> usage = 2;
}
message SetSettingsRequest {
  MutationContext context = 1;
  map<string, string> values = 2; // flat key -> text, parsed like `relay config set`
}
enum SettingOutcome {
  SETTING_OUTCOME_UNSPECIFIED = 0;
  SETTING_OUTCOME_APPLIED_LIVE = 1;
  SETTING_OUTCOME_SAVED_NEEDS_RESTART = 2;
  SETTING_OUTCOME_REJECTED = 3;
}
message SettingResult { string key = 1; SettingOutcome outcome = 2; string reason = 3; }
message SetSettingsResponse { Operation operation = 1; repeated SettingResult results = 2; }
enum InputAction {
  INPUT_ACTION_UNSPECIFIED = 0;
  INPUT_ACTION_PRESS = 1;
  INPUT_ACTION_RENEW = 2;
  INPUT_ACTION_RELEASE = 3;
  INPUT_ACTION_RELEASE_ALL = 4;
}
message InputControlMessage {
  ClientContext client = 1;
  bytes source_id = 2; // unique per input-control stream
  uint64 input_sequence = 3;
  bytes call_id = 4;
  uint64 controller_generation = 5;
  uint64 transmit_route_generation = 6;
  InputAction action = 7;
  uint32 requested_lease_ms = 8;
}
message InputControlAck {
  bytes source_id = 1;
  uint64 input_sequence = 2;
  bool accepted = 3;
  uint32 effective_lease_ms = 4;
  bool effective_transmitting = 5;
  Problem problem = 6;
}
message TelemetryRequest {
  ClientContext client = 1;
  repeated bytes call_ids = 2;
  uint32 meters_hz = 3;
  uint32 stats_hz = 4;
}
message CallTelemetry {
  bytes call_id = 1;
  bool speaking = 2;
  optional float receive_dbfs = 3;
  optional double rtt_ms = 4;
  optional double rtp_interarrival_jitter_ms = 5;
  double playout_target_ms = 6;
  uint64 packets_received = 7;
  uint64 packets_late = 8;
  uint64 packets_missing_at_deadline = 9;
  uint64 concealed_samples = 10;
  optional double estimated_mouth_to_ear_ms = 11;
  string latency_estimate_method = 12;
}
message TelemetrySnapshot {
  bytes engine_incarnation = 1;
  uint64 sample_sequence = 2;
  uint64 monotonic_ms_since_engine_start = 3; // not comparable across engines
  optional float microphone_dbfs = 4;
  uint64 capture_overruns = 5;
  uint64 render_underruns = 6;
  uint64 telemetry_samples_dropped = 7;
  repeated CallTelemetry calls = 8;
}

// Channels. Stable problem codes on a FAILED Operation: CHANNEL_DENIED (uniform for
// every join failure), CHANNEL_LOCKED_OUT, CHANNEL_LIMIT, CHANNEL_NAME_INVALID.
// Passwords and invite secrets appear ONLY in request bodies (and in the
// CreateInviteResponse); never in events, snapshots, operations or logs.
enum InboundPolicy {
  INBOUND_POLICY_UNSPECIFIED = 0;
  INBOUND_POLICY_ANYONE = 1;
  INBOUND_POLICY_SHARED_CHANNEL_ONLY = 2;
}
enum AdvertMode {
  ADVERT_MODE_UNSPECIFIED = 0;
  ADVERT_MODE_VISIBLE = 1;
  ADVERT_MODE_HIDDEN = 2;
}
message ChannelPolicy { bool listed = 1; bool password = 2; bool invite_only = 3; }
message ChannelInfo {
  bytes channel_id = 1;
  string name = 2;
  ChannelPolicy policy = 3;
  string role = 4; // owner | admin | member
  uint32 shared_peers = 5;
  uint64 cert_expires_unix = 6;
}
message CreateChannelRequest {
  MutationContext context = 1;
  string name = 2;
  ChannelPolicy policy = 3;
  string password = 4; // secret: never echoed or logged
}
message JoinChannelRequest {
  MutationContext context = 1;
  bytes channel_id = 2;
  string name = 3;
  string password = 4; // secret
  string invite = 5; // secret RLYI1... token
}
message LeaveChannelRequest { MutationContext context = 1; bytes channel_id = 2; }
message ListChannelsRequest { ClientContext client = 1; }
message ListChannelsResponse { repeated ChannelInfo channels = 1; }
message CreateInviteRequest {
  MutationContext context = 1;
  bytes channel_id = 2;
  uint32 ttl_seconds = 3;
  uint32 uses = 4;
}
message CreateInviteResponse {
  string invite = 1; // secret; empty when the operation failed
  uint64 expires_unix = 2;
  Operation operation = 3; // FAILED with CHANNEL_DENIED etc. when no invite was made
}
message RevokeChannelMemberRequest {
  MutationContext context = 1;
  bytes channel_id = 2;
  bytes fingerprint = 3;
}
message SetPrivacyRequest {
  MutationContext context = 1;
  optional InboundPolicy inbound_policy = 2;
  optional AdvertMode advert_mode = 3;
}

// Avatars: canonical lossless WebP (256x256), at most avatar_max_bytes (1 MiB). Unknown hash is NOT_FOUND.
message GetAvatarRequest { ClientContext client = 1; bytes avatar_sha256 = 2; }
message AvatarImage {
  bytes avatar_sha256 = 1;
  bytes image = 2; // encoded image file; format given by media_type
  uint32 width = 3;
  uint32 height = 4;
  string media_type = 5; // always "image/webp" (lossless) today
}

// What a remote user needs to reach this device.
message ConnectionInfo {
  repeated string local_addresses = 1; // eligible LAN IPs, no port
  uint32 listen_port = 2;
  bytes fingerprint = 3; // local identity fingerprint
  string connection_string = 4; // opaque, built by the engine; clients display/copy it
}

// ---------------------------------------------------------------------------------------------
// Session messaging. Needs the `messages` capability (never granted by default, `admin` does not
// imply it): transcripts are private to the people in the call. Stable Problem.code values on a
// FAILED SessionOpResult.operation: MESSAGES_DISABLED, SESSION_NOT_FOUND, SESSION_ENDED,
// SESSION_PERMISSION_OFF, PEER_UNAVAILABLE, TEXT_INVALID, TEXT_TOO_LONG, IMAGE_INVALID,
// IMAGE_UNSUPPORTED, IMAGE_TOO_LARGE, HISTORY_FULL, RATE_LIMITED, TOO_MANY_OFFERS,
// MESSAGE_NOT_FOUND, MESSAGE_STATE, OFFER_NOT_FOUND, OFFER_STATE, FILE_REFUSED,
// FILE_TOO_LARGE, FILE_CHANGED, TOO_MANY_TRANSFERS, NO_SPACE, DESTINATION_INVALID,
// PREVIEW_UNAVAILABLE, EXPORT_TOO_LARGE, EXPORT_WRITE_FAILED, INVALID_SETTING.
// Message text and file names never appear in Problem messages or logs.
// ---------------------------------------------------------------------------------------------
enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  SESSION_STATE_ACTIVE = 1; // the call is live
  SESSION_STATE_ENDED = 2;  // read-only transcript kept in RAM until cleared, replaced or the daemon exits
}
enum DeliveryState {
  DELIVERY_STATE_UNSPECIFIED = 0;
  DELIVERY_STATE_SENDING = 1;
  DELIVERY_STATE_DELIVERED = 2; // the peer's daemon stored it (always set for incoming entries)
  DELIVERY_STATE_FAILED = 3;    // see TranscriptEntry.failure
}
enum OfferState {
  OFFER_STATE_UNSPECIFIED = 0;
  OFFER_STATE_OFFERED = 1;
  OFFER_STATE_IN_PROGRESS = 2;
  OFFER_STATE_COMPLETED = 3;
  OFFER_STATE_REJECTED = 4;
  OFFER_STATE_FAILED = 5;
  OFFER_STATE_CANCELLED = 6;
  OFFER_STATE_EXPIRED = 7; // the call ended before it was accepted; metadata only
}
message SessionPermissions { bool allow_messages = 1; bool allow_files = 2; }
message SessionSummary {
  bytes session_id = 1;  // 16 bytes
  bytes call_id = 2;
  bytes peer_id = 3;     // 32 bytes
  string peer_name = 4;
  SessionState state = 5;
  SessionPermissions permissions = 6;
  bool local_is_host = 7; // the caller owns the permission toggles and pushes them to the guest
  uint64 started_at_unix_ms = 8;
  uint64 ended_at_unix_ms = 9;
  uint64 message_count = 10;
  uint64 next_ordinal = 11; // ordinal the next transcript entry will get
  uint64 used_bytes = 12;
  uint64 limit_bytes = 13;
}
message ImageBody {
  string media_type = 1;
  uint32 width = 2;
  uint32 height = 3;
  uint32 frames = 4;
  bytes data = 5; // original compressed bytes (at most 15 KiB inline); decode with your own limits
}
message FileOfferBody {
  bytes offer_id = 1;
  string name = 2;       // sanitized; shown, never used as a path
  uint64 size = 3;
  string media_type = 4; // advisory, guessed from the name
  bytes blake3 = 5;
  OfferState state = 6;
  uint64 transferred_bytes = 7;
  string preview = 8;    // approved text preview, if any
  bool preview_requested = 9;        // we asked, waiting for the sender's approval
  bool preview_approval_pending = 10; // the peer asked and this side's user must decide
  bool executable_warning = 11;      // the name looks executable; warn before the user opens it
  string saved_as = 12;  // final file name in the destination directory (receiver, completed)
  string failure = 13;   // stable lowercase reason when FAILED or CANCELLED
  bool outgoing = 14;
}
message TranscriptEntry {
  uint64 ordinal = 1;   // arrival order, never reused, survives ClearSession
  bool outgoing = 2;
  uint64 seq = 3;       // numbered by the sender; (outgoing, seq) identifies the entry
  uint64 sent_at_unix_ms = 4;     // the sender's claim; display only
  uint64 received_at_unix_ms = 5; // this daemon's clock; what to show
  DeliveryState delivery = 6;
  string failure = 7;   // timeout | disabled | too_large | invalid | rate_limited | history_full | unsupported | ended
  bool pinned = 8;
  oneof body { string text = 9; ImageBody image = 10; FileOfferBody file = 11; }
}
message MessageRef { uint64 ordinal = 1; bool outgoing = 2; uint64 seq = 3; }
message ListSessionsResponse {
  repeated SessionSummary sessions = 1;
  uint64 revision = 2; // pass to WatchSession.after_revision for a gapless follow
  MessagingSettings settings = 3;
}
message MessagingSettings {
  bool enabled = 1;
  uint32 max_offer_size_mib = 2;
  uint32 transfer_rate_limit_mbps = 3; // megabytes per second per transfer
  uint32 transfer_port = 4;            // effective data-link listener port (0 = not listening); set in config, applies at start
}
message GetTranscriptRequest {
  ClientContext client = 1;
  bytes session_id = 2;
  uint64 from_ordinal = 3; // first ordinal wanted; 0 = from the start
  uint32 limit = 4;        // entries, 0 = engine default; pages are also capped in bytes
}
message Transcript {
  SessionSummary session = 1;
  repeated TranscriptEntry entries = 2;
  uint64 next_ordinal = 3; // from_ordinal for the next page
  bool more = 4;
  uint64 revision = 5;     // feed revision at read time
}
message WatchSessionRequest {
  ClientContext client = 1;
  optional uint64 after_revision = 2; // omit for a SessionList first
  bytes session_id = 3;               // empty = every session
}
message SessionResync { uint64 current_revision = 1; string reason = 2; }
message SessionList { repeated SessionSummary sessions = 1; MessagingSettings settings = 2; }
message DeliveryChanged { bytes session_id = 1; uint64 seq = 2; DeliveryState delivery = 3; string failure = 4; }
message OfferChanged { bytes session_id = 1; uint64 ordinal = 2; FileOfferBody offer = 3; }
message PermissionsChanged { bytes session_id = 1; SessionPermissions permissions = 2; bool by_peer = 3; }
message PinChanged { bytes session_id = 1; MessageRef message = 2; bool pinned = 3; }
message SessionCleared { bytes session_id = 1; bool removed = 2; uint64 next_ordinal = 3; }
message HistoryEvicted { bytes session_id = 1; string reason = 2; }
message SessionEvent {
  oneof event {
    NewEntry entry = 1;
    DeliveryChanged delivery = 2;
    OfferChanged offer = 3;
    PermissionsChanged permissions = 4;
    PinChanged pin = 5;
    SessionSummary session = 6;  // started, ended or its counters changed
    SessionCleared cleared = 7;
    HistoryEvicted evicted = 8;  // an ended transcript was dropped to stay inside the retained budget
  }
}
message NewEntry { bytes session_id = 1; TranscriptEntry entry = 2; }
message SessionEnvelope {
  bytes engine_incarnation = 1;
  uint64 revision = 2;
  oneof body { SessionList list = 3; SessionEvent event = 4; SessionResync resync = 5; }
}
message SendSessionMessageRequest { MutationContext context = 1; bytes session_id = 2; string text = 3; }
message SendSessionImageRequest { MutationContext context = 1; bytes session_id = 2; bytes image = 3; }
message RetrySessionMessageRequest { MutationContext context = 1; bytes session_id = 2; uint64 seq = 3; }
// The DAEMON opens `path`: it must be an absolute path to a regular file on the daemon's machine
// (clients are same-machine, same-user), not a symlink (a symlink anywhere in the path is refused),
// and at most messages.max_offer_size_mib. The daemon hashes a snapshot on a worker.
message OfferFileRequest { MutationContext context = 1; bytes session_id = 2; string path = 3; }
message OfferRequest { MutationContext context = 1; bytes session_id = 2; bytes offer_id = 3; }
// accept=true needs `destination_dir`, an absolute existing directory chosen by the client. The
// daemon sanitizes the name (optionally suggested in `file_name`) and never overwrites.
message RespondOfferRequest {
  MutationContext context = 1;
  bytes session_id = 2;
  bytes offer_id = 3;
  bool accept = 4;
  string destination_dir = 5;
  string file_name = 6;
}
message ApprovePreviewRequest { MutationContext context = 1; bytes session_id = 2; bytes offer_id = 3; bool approve = 4; }
message SetSessionPermissionsRequest {
  MutationContext context = 1;
  bytes session_id = 2;
  optional bool allow_messages = 3;
  optional bool allow_files = 4;
}
message PinMessageRequest { MutationContext context = 1; bytes session_id = 2; bool outgoing = 3; uint64 seq = 4; bool pinned = 5; }
message SearchSessionRequest { ClientContext client = 1; bytes session_id = 2; string query = 3; }
message SearchSessionResponse { repeated MessageRef hits = 1; bool truncated = 2; }
// Active session: empties the transcript. Ended session: removes it. Local only; the peer keeps its own.
message ClearSessionRequest { MutationContext context = 1; bytes session_id = 2; }
// Returns the export JSON (docs/session-messages.md) in `json` and writes nothing. Only when
// `destination_path` is set (absolute, must not exist) the daemon writes the file, owner-only,
// and returns `written_path` instead; large exports need it (EXPORT_TOO_LARGE otherwise).
message ExportSessionRequest { MutationContext context = 1; bytes session_id = 2; bool embed_images = 3; string destination_path = 4; }
message ExportSessionResponse { Operation operation = 1; bytes json = 2; string written_path = 3; }
// Live-applied preferences messages.enabled, messages.max_offer_size_mib and
// messages.transfer_rate_limit_mbps. network.transfer_port is set in config and applies at start.
message SetMessagingSettingsRequest {
  MutationContext context = 1;
  optional bool enabled = 2;
  optional uint32 max_offer_size_mib = 3;
  optional uint32 transfer_rate_limit_mbps = 4;
}
// Result of every messaging mutation. `operation` is final (APPLIED or FAILED).
message SessionOpResult {
  Operation operation = 1;
  bytes session_id = 2;
  MessageRef message = 3;  // the entry created or affected, when there is one
  bytes offer_id = 4;      // OfferFile: the new offer
}

// Favorites: the whole ordered list is sent, so add, remove and move are one request.
// Peers that are not trusted, more than 6 entries or a duplicate fail with a reason.
message SetFavoritesRequest {
  MutationContext context = 1;
  repeated bytes peer_ids = 2; // 32 bytes each, first = position 0
}
