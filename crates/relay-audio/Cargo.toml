[package]
name = "relay-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cpal.workspace = true
opus.workspace = true
rtrb.workspace = true
rubato.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sonora = { workspace = true, optional = true }
nnnoiseless = { workspace = true, optional = true }
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "android"))'.dependencies]
audio_thread_priority.workspace = true

[features]
# Optional neural backends; stubbed behind clear errors until a qualified artifact exists.
rnnoise = []
dtln = []
# Evaluation-only candidates behind `dsp::eval`; never enabled by default.
eval-sonora = ["dep:sonora"]
eval-nnnoiseless = ["dep:nnnoiseless"]

[lints]
workspace = true
