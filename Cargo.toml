[workspace]
resolver = "3"
members = [
	"crates/relay-core",
	"crates/relay-protocol",
	"crates/relay-audio",
	"crates/relay-net",
	"crates/relay-config",
	"crates/relay-api",
	"crates/relay-engine",
	"crates/relay-platform",
	"crates/relay-client",
	"crates/relay-ui",
	"crates/relay-messages",
	"crates/relay-io",
	"apps/relay-cli",
	"apps/relay-daemon",
	"apps/relay-desktop",
	"crates/relay-testkit",
	"benches",
]
# A plain `cargo build` / `cargo run` builds the desktop app and everything it
# needs. relay-benches pulls bench and neural tooling, so it is built explicitly
# (`-p relay-benches`). The terminal-only crates stay free of GUI dependencies
# (`cargo tree -p relay-cli`).
default-members = [
	"crates/relay-core",
	"crates/relay-protocol",
	"crates/relay-audio",
	"crates/relay-net",
	"crates/relay-config",
	"crates/relay-api",
	"crates/relay-engine",
	"crates/relay-platform",
	"crates/relay-client",
	"crates/relay-messages",
	"crates/relay-io",
	"crates/relay-ui",
	"apps/relay-cli",
	"apps/relay-daemon",
	"apps/relay-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/PixelSoftwareStudios/Relay"

[workspace.dependencies]
# Internal crates
relay-core = { path = "crates/relay-core" }
relay-protocol = { path = "crates/relay-protocol" }
relay-audio = { path = "crates/relay-audio" }
relay-net = { path = "crates/relay-net" }
relay-config = { path = "crates/relay-config" }
relay-api = { path = "crates/relay-api" }
relay-engine = { path = "crates/relay-engine" }
relay-platform = { path = "crates/relay-platform" }
relay-client = { path = "crates/relay-client" }
relay-ui = { path = "crates/relay-ui" }
relay-messages = { path = "crates/relay-messages" }
relay-io = { path = "crates/relay-io" }
# Test and bench support (dev-dependency only; not a default member)
relay-testkit = { path = "crates/relay-testkit" }

# Audio devices, buffering, resampling and codec
cpal = { version = "0.18.2" }
# AAudio streams with the voice-communication preset on Android (same version cpal uses)
ndk = { version = "0.9.0", default-features = false, features = ["audio", "api-level-28"] }
# Biquad IIR filters (the voice high-pass); no_std, allocation-free
biquad = "0.6.0"
libc = "0.2"
# Mach timebase for the macOS time-constraint policy (libc deprecates its mach items)
mach2 = "0.6.0"
# Safe wrappers over syscalls (uid, no-replace rename) and cross-platform free space
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs", "process", "thread"] }
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
opus = "0.4.0"
rtrb = "0.4.1"
rubato = "5.0.1"
# Decoder for the custom ringtone (settings): MP3, Ogg Vorbis, FLAC, WAV/PCM, AAC (ADTS and M4A). Pure
# Rust, MPL-2.0 (file-level copyleft, used unmodified; allowed for these crates in deny.toml).
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "ogg", "vorbis", "flac", "wav", "pcm", "aac", "isomp4"] }
bytemuck = "1"
# Evaluation-only audio processing candidates (not default features)
sonora = "0.2.0"
nnnoiseless = { version = "0.5.2", default-features = false }
# Pure-Rust ONNX inference and FFT for the neural candidates in relay-benches
tract-onnx = "0.23.10"
realfft = "3.5.1"

# Local control API (gRPC / protobuf)
tonic = "0.14.9"
tonic-prost = "0.14.9"
tonic-prost-build = "0.14.9"
prost = "0.14.4"
protoc-bin-vendored = "3.3.0"
tokio-stream = "0.1.19"
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }

# Async runtime and concurrency
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "time", "signal", "macros", "io-util", "fs"] }
arc-swap = "1.9.3"

# Peer discovery and secure transport
mdns-sd = "0.21.7"
if-addrs = "0.15"
ipnet = "2.12.2"
snow = "0.10.0"
blake3 = "1.8.7"
zeroize = "1.9.1"
rand = "0.10.3"

# Named channels: PAKE, membership certificates, password stretching
spake2 = "0.4.0"
ed25519-dalek = "2.2.0"
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
unicode-normalization = "0.1.24"
unicode-security = "0.1.3"

# Config, identity and avatars
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.0"
directories = "6.0.0"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
keyring = "4.2.0"
hex = "0.4.3"
# Constant-time comparison for secrets and tokens
subtle = "2.6.1"
# Base64 for the session export
base64 = "0.22.1"
gethostname = "1.0"
serde_json = "1"

# Message text: CommonMark parsing, URL detection and IDN hostnames
pulldown-cmark = { version = "0.13.6", default-features = false }
linkify = "0.11.0"
idna = "1.1.0"

# Local time zone for message timestamps (system zone lookup, DST-correct, injectable zone)
jiff = { version = "0.2.39", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-concatenated", "tzdb-bundle-platform"] }

# Storage (settings, trust and avatar cache in one per-user SQLite database)
rusqlite = { version = "0.41.1", features = ["bundled"] }

# CLI and terminal UI
clap = { version = "4.6.7", features = ["derive"] }
# Shell completions and the man page (`relay completions`, `relay man`)
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
ratatui = "0.30.2"
crossterm = "0.29.0"
rpassword = "7.5.4"
# Clipboard text only: no image support, so no extra codecs or system libraries.
arboard = { version = "3.7.0", default-features = false }
comfy-table = "8.0.1"

# Platform integration: global hotkeys and push-to-talk
global-hotkey = "0.9.0"
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "global_shortcuts"] }
# RealtimeKit client for relay-audio (feature `rtkit`); already in the tree through ashpd
zbus = { version = "5.19.0", default-features = false, features = ["tokio", "blocking-api"] }
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }
# macOS microphone permission: read the TCC status and show the system prompt (relay-platform)
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
block2 = "0.6.2"
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }

# Font cmap lookup for the bundled-font coverage tests (relay-ui dev-dependency)
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
# Shaper behind egui text layout; the same copy, used by the Devanagari shaping tests
harfrust = { version = "0.12.0", default-features = false, features = ["std"] }

# GUI (relay-ui, apps/relay-desktop)
egui = { version = "0.37.0", default-features = false }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "accesskit"] }
tray-icon = { version = "0.26.1", default-features = false }
async-trait = "0.1"
qrcode = { version = "0.14.1", default-features = false }
rfd = { version = "0.16.1", default-features = false, features = ["xdg-portal", "tokio", "wayland"] }

# Translations: Fluent messages (plurals, gender, per-key fallback) and language tags
fluent-bundle = "0.16.0"
unic-langid = "0.9.6"
# Embeds every localizations/<lang>/*.ftl found at build time (reads from disk in debug builds)
rust-embed = { version = "8.13.0", features = ["interpolate-folder-path", "include-exclude"] }
# System UI language lookup (apps/relay-desktop)
sys-locale = "0.3.2"

# Incoming-call desktop notifications and launch at login (apps/relay-desktop)
notify-rust = { version = "4.18.2", default-features = false, features = ["z"] }
auto-launch = "0.6.0"

# Errors and diagnostics
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
bytes = "1.12.1"

# Testing and benchmarking
proptest = "1.12.0"
criterion = "0.8.2"
tempfile = "3.27.0"
hound = "3.5.1"
cpu-time = "1.0.0"
claxon = "0.4.3"
sha2 = "0.10"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

# Line tables keep backtraces readable but cut debug builds (and the many test
# binaries) several times in size; full debuginfo filled the disk repeatedly.
[profile.dev]
debug = "line-tables-only"

# Dependencies that do the heavy lifting run optimised even in dev and test builds:
# password hashing, ciphers, the Opus codec, resampling, image codecs, SQLite and egui
# text layout are 10 to 50 times slower unoptimised and dominated the test runs.
# The workspace crates stay unoptimised, so edits keep rebuilding quickly.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.snow]
opt-level = 3
[profile.dev.package.spake2]
opt-level = 3
[profile.dev.package.ring]
opt-level = 3
[profile.dev.package.opusic-sys]
opt-level = 3
[profile.dev.package.opus]
opt-level = 3
[profile.dev.package.rubato]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.libsqlite3-sys]
opt-level = 3
[profile.dev.package.egui]
opt-level = 3
[profile.dev.package.epaint]
opt-level = 3
[profile.dev.package.ecolor]
opt-level = 3
[profile.dev.package.emath]
opt-level = 3
[profile.dev.package.skrifa]
opt-level = 3
[profile.dev.package.read-fonts]
opt-level = 3
[profile.dev.package.harfrust]
opt-level = 3
[profile.dev.package.prost]
opt-level = 3

# Shipped binaries: fat LTO and no symbols (about 28 percent smaller than thin LTO with a
# symbol table; panic stays "unwind" because the media supervisor catches worker panics).
[profile.release]
lto = "fat"
codegen-units = 1
debug = false
strip = "symbols"

# A release build that keeps line tables and symbols for profiling and crash analysis:
# cargo build --profile release-debug
[profile.release-debug]
inherits = "release"
debug = "line-tables-only"
strip = "none"
