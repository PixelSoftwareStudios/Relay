[workspace]
resolver = "3"
members = [
	"crates/relay-core",
	"crates/relay-protocol",
	"crates/relay-audio",
	"crates/relay-net",
	"crates/relay-config",
	"crates/relay-api",
	"crates/relay-engine",
	"apps/relay-cli",
]
# The desktop shell pulls in a WebView toolchain, so headless builds skip it.
default-members = [
	"crates/relay-core",
	"crates/relay-protocol",
	"crates/relay-audio",
	"crates/relay-net",
	"crates/relay-config",
	"crates/relay-api",
	"crates/relay-engine",
	"apps/relay-cli",
]
exclude = ["apps/relay-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/PixelSoftwareStudios/Relay"

[workspace.dependencies]
# Internal crates
relay-core = { path = "crates/relay-core" }
relay-protocol = { path = "crates/relay-protocol" }
relay-audio = { path = "crates/relay-audio" }
relay-net = { path = "crates/relay-net" }
relay-config = { path = "crates/relay-config" }
relay-api = { path = "crates/relay-api" }
relay-engine = { path = "crates/relay-engine" }

# Audio devices, buffering, resampling and codec
cpal = "0.18.2"
opus = "0.4.0"
ringbuf = "0.6.0"
rubato = "5.0.1"
bytemuck = "1"

# Local control API (gRPC / protobuf)
tonic = "0.14.9"
tonic-prost = "0.14.9"
tonic-prost-build = "0.14.9"
prost = "0.14.4"
protoc-bin-vendored = "3.3.0"
tokio-stream = "0.1.19"
tower = "0.5"
hyper-util = "0.1"

# Async runtime and concurrency
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "time", "signal", "macros", "io-util", "fs"] }
arc-swap = "1.9.3"
crossbeam-queue = "0.3.14"

# Peer discovery and secure transport
mdns-sd = "0.21.7"
snow = "0.10.0"
blake3 = "1.8.7"
zeroize = "1.9.1"
rand = "0.10.3"

# Config, identity and avatars
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.0"
directories = "6.0.0"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
keyring = "4.2.0"
hex = "0.4.3"

# CLI, TUI and hotkeys
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30.2"
crossterm = "0.29.0"
global-hotkey = "0.9.0"

# Errors and diagnostics
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
bytes = "1.12.1"

# Testing and benchmarking
proptest = "1.12.0"
criterion = "0.8.2"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
