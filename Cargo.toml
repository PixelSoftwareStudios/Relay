[workspace]
resolver = "3"
members = [
	"crates/relay-core",
	"crates/relay-protocol",
	"crates/relay-audio",
	"crates/relay-net",
	"crates/relay-config",
	"crates/relay-api",
	"crates/relay-engine",
	"crates/relay-platform",
	"crates/relay-client",
	"apps/relay-cli",
	"apps/relay-desktop",
	"benches",
]
# The desktop GUI links windowing libraries, so headless builds skip it.
default-members = [
	"crates/relay-core",
	"crates/relay-protocol",
	"crates/relay-audio",
	"crates/relay-net",
	"crates/relay-config",
	"crates/relay-api",
	"crates/relay-engine",
	"crates/relay-platform",
	"crates/relay-client",
	"apps/relay-cli",
	"benches",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/PixelSoftwareStudios/Relay"

[workspace.dependencies]
# Internal crates
relay-core = { path = "crates/relay-core" }
relay-protocol = { path = "crates/relay-protocol" }
relay-audio = { path = "crates/relay-audio" }
relay-net = { path = "crates/relay-net" }
relay-config = { path = "crates/relay-config" }
relay-api = { path = "crates/relay-api" }
relay-engine = { path = "crates/relay-engine" }
relay-platform = { path = "crates/relay-platform" }
relay-client = { path = "crates/relay-client" }

# Audio devices, buffering, resampling and codec
cpal = "0.18.2"
opus = "0.4.0"
rtrb = "0.4.1"
rubato = "5.0.1"
bytemuck = "1"
# Evaluation-only audio processing candidates (not default features)
sonora = "0.2.0"
nnnoiseless = { version = "0.5.2", default-features = false }

# Local control API (gRPC / protobuf)
tonic = "0.14.9"
tonic-prost = "0.14.9"
tonic-prost-build = "0.14.9"
prost = "0.14.4"
protoc-bin-vendored = "3.3.0"
tokio-stream = "0.1.19"
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }

# Async runtime and concurrency
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "time", "signal", "macros", "io-util", "fs"] }
arc-swap = "1.9.3"

# Peer discovery and secure transport
mdns-sd = "0.21.7"
snow = "0.10.0"
blake3 = "1.8.7"
zeroize = "1.9.1"
rand = "0.10.3"

# Named channels: PAKE, membership certificates, password stretching
spake2 = "0.4.0"
ed25519-dalek = "2.2.0"
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }

# Config, identity and avatars
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.0"
directories = "6.0.0"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
keyring = "4.2.0"
hex = "0.4.3"
gethostname = "1.0"
serde_json = "1"

# Storage (settings, trust and avatar cache in one per-user SQLite database)
rusqlite = { version = "0.41.1", features = ["bundled"] }

# CLI and terminal UI
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30.2"
crossterm = "0.29.0"

# Platform integration: global hotkeys and push-to-talk
comfy-table = "8.0.1"
global-hotkey = "0.9.0"
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "global_shortcuts"] }
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }

# Desktop GUI (apps/relay-desktop only; not in default-members)
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "accesskit"] }
tray-icon = { version = "0.26.1", default-features = false }
async-trait = "0.1"

# Errors and diagnostics
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
bytes = "1.12.1"

# Testing and benchmarking
proptest = "1.12.0"
criterion = "0.8.2"
rtp = "0.17.2"
webrtc-util = { version = "0.17.1", default-features = false, features = ["marshal"] }
tempfile = "3.27.0"
hound = "3.5.1"
cpu-time = "1.0.0"
claxon = "0.4.3"
sha2 = "0.10"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
