# cargo-nextest settings. `just test` runs the whole workspace through it; doctests
# are not supported by nextest and run with `cargo test --doc` (also in `just test`).
#
# Retries stay off: a test that needs one is a bug to fix, not to hide.

[profile.default]
retries = 0
fail-fast = false
# A test that has run for 30 s is reported as slow; at four periods it is killed.
slow-timeout = { period = "30s", terminate-after = 4 }

# Tests that start real relayd processes and wait on the real clock. With ten test
# processes running at once they have been seen to miss their deadlines, so at most
# two of them run at the same time. See docs/build-performance.md.
[test-groups]
real-clock = { max-threads = 2 }

[[profile.default.overrides]]
filter = 'package(=relay-cli) & (binary(=autostart) | binary(=daemon_cmd) | binary(=daemon_admin) | binary(=real_engine) | binary(=real_chat) | binary(=startup_wait))'
test-group = 'real-clock'

[[profile.default.overrides]]
filter = 'package(=relay-client) & (binary(=daemon) | binary(=ensure) | binary(=startup_wait))'
test-group = 'real-clock'

# Every engine test binary drives real-time audio, media and peer links on the real clock (the e2e
# harness plays hardware in 10 ms ticks). CI runners have two to four slow cores, and with every
# binary running at once the ring/capture/consent waits missed their deadlines (media_output_route,
# service_e2e, channels_calls, media_release_delay). Only two engine tests run at the same time.
[[profile.default.overrides]]
filter = 'package(=relay-engine)'
test-group = 'real-clock'

# CI: the same limits, and a longer kill time for the tests that start whole daemons on a slow
# runner. Selected with `--profile ci`.
[profile.ci]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }
