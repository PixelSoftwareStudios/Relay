[package]
name = "relay-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "relay_cli"
path = "src/lib.rs"

[[bin]]
name = "relay"
path = "src/main.rs"

[dependencies]
relay-api.workspace = true
relay-client.workspace = true
relay-config.workspace = true
relay-daemon.workspace = true
relay-io.workspace = true
relay-messages.workspace = true
relay-net.workspace = true
relay-platform.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
ratatui.workspace = true
crossterm.workspace = true
comfy-table.workspace = true
global-hotkey.workspace = true
rpassword.workspace = true
arboard.workspace = true
zeroize.workspace = true
tokio.workspace = true
tonic.workspace = true
tokio-stream.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true
relay-engine.workspace = true
relay-core.workspace = true
# The engine's own two-daemon test harness is included by path (tests/real_chat.rs).
relay-audio.workspace = true
relay-protocol.workspace = true
image.workspace = true
blake3.workspace = true
tempfile.workspace = true

# The engine's test support is included by path (tests/real_chat.rs) and uses these.
[package.metadata.cargo-machete]
ignored = ["blake3", "relay-audio", "relay-protocol"]

[lints]
workspace = true
