[package]
name = "relay-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "Optional Tauri desktop client for the Relay daemon"
repository = "https://github.com/PixelSoftwareStudios/Relay"
build = "build.rs"

# Standalone on purpose: the root workspace excludes this package so headless
# builds never need a WebView toolchain. It keeps its own Cargo.lock and pins
# the same dependency versions as the root `[workspace.dependencies]`.
[workspace]

[lib]
name = "relay_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "relay-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
relay-api = { path = "../../../crates/relay-api" }
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
async-trait = "0.1"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tonic = "0.14.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
