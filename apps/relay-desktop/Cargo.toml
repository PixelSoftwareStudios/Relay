[package]
name = "relay-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Optional native (egui) desktop client for the Relay daemon"

[lib]
name = "relay_desktop"
path = "src/lib.rs"

[[bin]]
name = "relay-desktop"
path = "src/main.rs"

[dependencies]
relay-ui.workspace = true
relay-io.workspace = true
eframe.workspace = true
egui.workspace = true
tray-icon.workspace = true
rfd.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
notify-rust.workspace = true
auto-launch.workspace = true
directories.workspace = true
serde.workspace = true
toml.workspace = true

# Linux has no GTK main loop here, so the pure-Rust StatusNotifier backend is used.
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { workspace = true, features = ["ksni"] }

[dev-dependencies]
image.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
