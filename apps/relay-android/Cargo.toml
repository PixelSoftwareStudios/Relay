# The Android app's Rust library. Not a member of the root workspace (own
# [workspace] table, own Cargo.lock): it needs the Android targets and NDK.
# Built by Gradle through cargo-ndk; see docs/android.md.
[package]
name = "relay-android"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace]

[lib]
name = "relay_android"
crate-type = ["cdylib", "lib"]

[dependencies]
relay-ui = { path = "../../crates/relay-ui" }
relay-engine = { path = "../../crates/relay-engine" }
relay-config = { path = "../../crates/relay-config" }
relay-audio = { path = "../../crates/relay-audio" }
relay-net = { path = "../../crates/relay-net" }
relay-api = { path = "../../crates/relay-api" }
relay-io = { path = "../../crates/relay-io" }
egui = { version = "0.37.0", default-features = false }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
uniffi = "0.32.2"
thiserror = "2.0.21"
zeroize = "1.9.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std", "tracing-log"] }
hex = "0.4.3"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "android-game-activity"] }
android-activity = { version = "0.6", features = ["game-activity"] }
tracing-android = "0.2.0"

[profile.release]
opt-level = 3
debug = false
# Keep the symbol table: UniFFI reads its metadata from the library. Gradle strips it again.
strip = "debuginfo"
panic = "unwind"

# winit 0.30 drops GameActivity soft-keyboard text; see third_party/winit/RELAY.md.
[patch.crates-io]
winit = { path = "third_party/winit" }
