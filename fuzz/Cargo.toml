[package]
name = "relay-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

# Separate workspace: the fuzz crate never joins the main one, and its
# libfuzzer dependency needs a nightly toolchain.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
prost = "0.14.4"
relay-config = { path = "../crates/relay-config" }
relay-messages = { path = "../crates/relay-messages" }
relay-net = { path = "../crates/relay-net" }
relay-protocol = { path = "../crates/relay-protocol" }
tokio = { version = "1.54.1", features = ["rt", "net", "io-util"] }

[[bin]]
name = "rtp_parse"
path = "fuzz_targets/rtp_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "record_header"
path = "fuzz_targets/record_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "control_envelope"
path = "fuzz_targets/control_envelope.rs"
test = false
doc = false
bench = false

