# cargo-about configuration. Keep the accepted list in step with deny.toml.
accepted = [
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"MIT",
	"MIT-0",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"ISC",
	"Zlib",
	"0BSD",
	"CC0-1.0",
	"BSL-1.0",
	"Unicode-3.0",
	"Unlicense",
	"MPL-2.0",
	"OFL-1.1",
	"Ubuntu-font-1.0",
]
targets = [
	"aarch64-apple-darwin",
	"x86_64-apple-darwin",
	"x86_64-pc-windows-msvc",
	"aarch64-pc-windows-msvc",
	"x86_64-unknown-linux-gnu",
	"aarch64-unknown-linux-gnu",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true
