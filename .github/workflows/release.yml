name: release

# Tag vX.Y.Z (equal to the workspace version) to build, verify and publish every package.
# A pull request that touches packaging builds everything without publishing. Run it by hand
# to build only, or to publish an existing tag from a finished run's artifacts.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/actions/release-tools/**'
      - 'scripts/packaging/**'
      - 'scripts/tests/**'
      - 'packaging/**'
      - 'cliff.toml'
      - 'about.toml'
      - 'about.hbs'
      - 'assets/icon/**'
      - 'assets/font/OFL-*.txt'
      - 'assets/font/LICENSE-phosphor.txt'
      - 'apps/relay-desktop/Cargo.toml'
      - 'apps/relay-desktop/resources/**'
      - 'contrib/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'docs/release.md'
      - 'docs/releasing.md'
  workflow_dispatch:
    inputs:
      artifacts-run:
        description: Optional completed release run whose successful artifacts should be reused
        type: string
        default: ''
      publish-tag:
        description: Existing tag to publish when reusing artifacts (leave empty for build-only runs)
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  version:
    name: Validate release contract
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      toolchain: ${{ steps.version.outputs.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.publish-tag || github.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - id: version
        env:
          RELEASE_TAG: ${{ inputs.publish-tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: python scripts/packaging/package_release.py validate --tag "$RELEASE_TAG"
      - name: Verify artifact provenance and all required builds
        if: inputs.artifacts-run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.artifacts-run }}
          RELEASE_TAG: ${{ inputs.publish-tag }}
        run: python scripts/packaging/verify_release_run.py --repo "$GITHUB_REPOSITORY" --run "$SOURCE_RUN" --tag "$RELEASE_TAG"
      - run: python -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: The compiled-in update public key is not the test key
        # Same gate as the sign job: nothing can be published with the test key.
        if: inputs.artifacts-run == '' && github.event_name != 'pull_request'
        run: python scripts/packaging/sign_release.py check-key
      - name: Generate the complete changelog
        if: inputs.artifacts-run == ''
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          version: v2.14.2
          args: --output CHANGELOG.md
      - name: Generate this release's changes
        if: inputs.artifacts-run == ''
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          version: v2.14.2
          args: ${{ github.ref_type == 'tag' && '--latest' || format('--unreleased --tag v{0}', steps.version.outputs.version) }} --strip header --output RELEASE_CHANGES.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: inputs.artifacts-run == ''
        with:
          name: release-changes-${{ steps.version.outputs.version }}
          path: |
            CHANGELOG.md
            RELEASE_CHANGES.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  notices:
    name: Third-party notices
    needs: version
    if: inputs.artifacts-run == ''
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          toolchain: ${{ needs.version.outputs.toolchain }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: release-notices
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-about@0.9.3
      - run: cargo about generate about.hbs > THIRD_PARTY_LICENSES
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: third-party-notices
          path: THIRD_PARTY_LICENSES
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.target }}
    if: inputs.artifacts-run == ''
    needs: [version, notices]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      RELEASE_DIR: target/${{ matrix.target }}/release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          toolchain: ${{ needs.version.outputs.toolchain }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        env:
          CACHE_ON_FAILURE: 'true'
        with:
          key: release-${{ matrix.target }}
          # Tag builds restore the cache; only main may save it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: third-party-notices
          path: .
      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libgtk-3-dev libxkbcommon-dev libwayland-dev libayatana-appindicator3-dev desktop-file-utils patchelf file rpm libfuse2
      - name: Link the Windows C runtime statically
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"RUSTFLAGS=-C target-feature=+crt-static" >> $env:GITHUB_ENV'
      - name: Test packaging on the native platform
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Build the headless programs (relay, relayd)
        run: cargo build --locked --release -p relay-daemon -p relay-cli --target ${{ matrix.target }}
      - name: Headless programs have no GUI dependencies
        shell: bash
        run: '! cargo tree --locked -p relay-cli -p relay-daemon --target ${{ matrix.target }} | grep -E "eframe|egui|winit"'
      - name: Build the desktop window
        run: cargo build --locked --release -p relay-desktop --target ${{ matrix.target }}
      - name: Package the headless archive
        run: python scripts/packaging/package_cli.py --version ${{ needs.version.outputs.version }} --target ${{ matrix.target }} --bin-dir "$RELEASE_DIR" --output dist
        shell: bash
      - name: Package the portable archive and macOS images
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then python -m pip install --require-hashes -r scripts/packaging/requirements.txt; fi
          python scripts/packaging/package_release.py package --version ${{ needs.version.outputs.version }} --target ${{ matrix.target }} --bin-dir "$RELEASE_DIR" --output dist
      - name: Verify the DMG and update ZIP hold the identical signed app
        if: runner.os == 'macOS'
        run: python scripts/packaging/verify_macos_release.py --version ${{ needs.version.outputs.version }} --target ${{ matrix.target }} --dmg dist/relay-${{ needs.version.outputs.version }}-*.dmg --update dist/relay-${{ needs.version.outputs.version }}-*-update.zip
      - uses: ./.github/actions/release-tools
        if: runner.os == 'Linux'
        with:
          toolchain: ${{ needs.version.outputs.toolchain }}
      - name: Package Linux installers
        if: runner.os == 'Linux'
        run: python scripts/packaging/package_linux.py --version ${{ needs.version.outputs.version }} --target ${{ matrix.target }} --bin-dir "$RELEASE_DIR" --output dist
      - name: Inspect Linux desktop integration and native packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          desktop-file-validate packaging/relay.desktop
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          rpm -qip dist/*.rpm
          rpm -qlp dist/*.rpm
          for program in relay relayd relay-desktop; do
            ldd "$RELEASE_DIR/$program" | tee "dependencies-$program.txt"
            if grep -q 'not found' "dependencies-$program.txt"; then exit 1; fi
          done
          dpkg-deb --contents dist/*.deb | grep -E ' (\./)?usr/bin/relayd$'
          rpm -qlp dist/*.rpm | grep -x /usr/bin/relayd
          appimage=$(realpath dist/*.AppImage)
          inspection=$(mktemp -d)
          cd "$inspection"
          "$appimage" --appimage-extract > /dev/null
          for program in relay relayd relay-desktop; do test -x "squashfs-root/usr/bin/$program"; done
      - name: Install WiX 5
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix --version 5.0.2 --allow-roll-forward
      - name: Package the Windows MSI
        if: runner.os == 'Windows'
        shell: bash
        run: python scripts/packaging/package_windows.py --version ${{ needs.version.outputs.version }} --target ${{ matrix.target }} --bin-dir "$RELEASE_DIR" --output dist
      - name: Verify MSI install, repair and uninstall
        if: runner.os == 'Windows'
        # Normally about a minute. A hung msiexec once held a runner for the whole job limit; fail fast
        # instead, so the installer-log upload below runs.
        timeout-minutes: 15
        shell: pwsh
        run: ./scripts/packaging/verify_windows_install.ps1 -Installer (Get-ChildItem dist/*.msi).FullName -BinDir $env:RELEASE_DIR
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: relay-${{ needs.version.outputs.version }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure() && runner.os == 'Windows'
        with:
          name: windows-installer-logs-${{ matrix.target }}
          path: msi-*.log

  android:
    name: Build Android APK
    # Never on pull requests: the signing environment only opens for main and v* tags.
    if: inputs.artifacts-run == '' && github.event_name != 'pull_request'
    environment: android-signing
    needs: [version]
    # 24.04: the prebuilt cargo-ndk binary needs glibc 2.39 (22.04 has 2.35)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          toolchain: ${{ needs.version.outputs.toolchain }}
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-android
          workspaces: |
            .
            apps/relay-android
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: just@1.43.0,cargo-ndk@4.1.2
      - name: Android NDK (r28c, 28.2.13676358)
        id: ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r28c
          # No local-cache: a cache saved by an earlier run restored an NDK without its toolchains/ clang.
      # The action only reports the path (an output) and adds it to PATH: it sets no environment variable.
      - name: Use the NDK and check its version
        env:
          NDK_PATH: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          grep -q 'Pkg.Revision = 28.2.13676358' "$NDK_PATH/source.properties"
          # The runner image sets ANDROID_NDK_ROOT to an older NDK; point both variables at r28c.
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
      - name: Build the release APK signed with the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELAY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELAY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELAY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export RELAY_KEYSTORE_FILE="$RUNNER_TEMP/relay-release.jks"
          trap 'rm -f "$RELAY_KEYSTORE_FILE"' EXIT
          (umask 077; printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RELAY_KEYSTORE_FILE")
          just android-release
      - name: Name and checksum the APK
        run: python scripts/packaging/package_android.py --version ${{ needs.version.outputs.version }} --apk dist/android/relay-${{ needs.version.outputs.version }}-android-arm64-v8a.apk --output release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: relay-${{ needs.version.outputs.version }}-android-arm64-v8a
          path: release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  sign:
    name: Sign update packages
    # Never on pull requests: the signing environment only opens for main and v* tags.
    if: inputs.artifacts-run == '' && github.event_name != 'pull_request'
    environment: update-signing
    needs: [version, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      # minisign 0.12 static Linux build, https://github.com/jedisct1/minisign/releases/tag/0.12
      MINISIGN_URL: https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
      MINISIGN_SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Install minisign (pinned release, SHA-256 verified; no third-party action holds the key)
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/minisign.tar.gz" "$MINISIGN_URL"
          echo "$MINISIGN_SHA256  $RUNNER_TEMP/minisign.tar.gz" | sha256sum --check -
          mkdir "$RUNNER_TEMP/minisign"
          tar -xzf "$RUNNER_TEMP/minisign.tar.gz" -C "$RUNNER_TEMP/minisign" minisign-linux/x86_64/minisign
          install -m 755 "$RUNNER_TEMP/minisign/minisign-linux/x86_64/minisign" "$RUNNER_TEMP/minisign-bin"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: relay-${{ needs.version.outputs.version }}-*
          path: dist
          merge-multiple: true
      - name: The compiled-in update public key is not the test key
        run: python scripts/packaging/sign_release.py check-key
      - name: Sign and verify every package
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_SIGNING_PASSWORD: ${{ secrets.UPDATE_SIGNING_PASSWORD }}
        run: python scripts/packaging/sign_release.py sign --version ${{ needs.version.outputs.version }} --assets dist --output signatures --minisign "$RUNNER_TEMP/minisign-bin"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: relay-${{ needs.version.outputs.version }}-signatures
          path: signatures/*.minisig
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  assemble:
    name: Verify complete release and checksums
    needs: [version, build, android, sign]
    if: ${{ !cancelled() && needs.version.result == 'success' && ((needs.build.result == 'success' && needs.android.result == 'success' && needs.sign.result == 'success') || (needs.build.result == 'skipped' && needs.android.result == 'skipped' && needs.sign.result == 'skipped')) }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.publish-tag || github.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: relay-${{ needs.version.outputs.version }}-*
          path: dist
          merge-multiple: true
          run-id: ${{ inputs.artifacts-run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Require every package and generate SHA256SUMS.txt
        run: python scripts/packaging/package_release.py finalize --version ${{ needs.version.outputs.version }} --output dist
      - name: Independently verify the checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: relay-release-${{ needs.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish complete GitHub release
    needs: [version, assemble]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.assemble.result == 'success' && ((github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.artifacts-run != '' && inputs.publish-tag != '')) }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.publish-tag || github.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: relay-release-${{ needs.version.outputs.version }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-changes-${{ needs.version.outputs.version }}
          path: changes
          run-id: ${{ inputs.artifacts-run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*
      - name: Publish after every package succeeded
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.publish-tag || github.ref_name }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS.txt)
          python scripts/packaging/package_release.py notes --version "$RELEASE_VERSION" --changes changes/RELEASE_CHANGES.md --output release-body.md
          if gh release view "$RELEASE_TAG" --json isDraft > release.json; then
            if ! jq -e '.isDraft == true' release.json > /dev/null; then
              echo '::error::Release already published; use a new version tag.'
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --notes-file release-body.md --title "Relay $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort > uploaded.txt
          find dist -maxdepth 1 -type f -printf '%f\n' | sort > expected.txt
          diff -u expected.txt uploaded.txt
          prerelease=false
          if [[ "$RELEASE_VERSION" == *-* ]]; then prerelease=true; fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease" --notes-file release-body.md
