name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          toolchain: "1.99.1"
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Everything except the GUI (relay-ui, relay-desktop) and benches: no windowing libraries.
  headless:
    name: headless (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          toolchain: "1.99.1"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: headless
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - run: cargo clippy --locked --workspace --exclude relay-ui --exclude relay-desktop --exclude relay-benches --all-targets -- -D warnings
      - run: cargo test --locked --workspace --exclude relay-ui --exclude relay-desktop --exclude relay-benches
      - name: Terminal-only crates have no GUI dependencies
        shell: bash
        run: '! cargo tree --locked -p relay-cli -p relay-daemon | grep -E "eframe|egui|winit"'
      # Bench and neural tooling, so it is built explicitly.
      - run: cargo clippy --locked -p relay-benches --all-targets -- -D warnings
      - run: cargo test --locked -p relay-benches

  # The desktop GUI links windowing libraries, so it is built on its own (relay-ui included).
  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          toolchain: "1.99.1"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev pkg-config libgtk-3-dev
          libxkbcommon-dev libwayland-dev libayatana-appindicator3-dev
      - run: cargo clippy --locked -p relay-desktop -p relay-ui --all-targets -- -D warnings
      - run: cargo test --locked -p relay-desktop -p relay-ui

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features
      - name: cargo deny (Android workspace)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: apps/relay-android/Cargo.toml
          command: check
          arguments: --all-features
      - name: cargo deny (fuzz crate)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: fuzz/Cargo.toml
          command: check
          arguments: --all-features

  # Compile-only check that the fuzz targets still build; it does not fuzz.
  fuzz-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1 branch; toolchain set below
        with:
          toolchain: nightly-2026-11-04
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo fuzz build
