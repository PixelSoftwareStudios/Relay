name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  android-check:
    name: Android Clippy at the declared MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8
        with:
          toolchain: "1.99.0"
          targets: aarch64-linux-android
          components: clippy
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
        with:
          tool: cargo-ndk@4.1.2
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
        with:
          ndk-version: r28c
          local-cache: true
      - run: cargo +1.99.0 ndk -t arm64-v8a -P 28 clippy --locked --manifest-path apps/relay-android/Cargo.toml --lib -- -D warnings

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8
        with:
          toolchain: "1.99.1"
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgtk-3-dev libxkbcommon-dev libwayland-dev libayatana-appindicator3-dev
      - name: Check public documentation links
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links -D rustdoc::invalid_html_tags"
        run: cargo doc --locked --workspace --all-features --no-deps

  concurrency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8
        with:
          toolchain: "1.99.1"
      - name: Model stream health with Loom
        env:
          RUSTFLAGS: "--cfg loom"
        run: cargo test --locked --manifest-path checks/concurrency/Cargo.toml

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8
        with:
          toolchain: nightly-2026-11-04
          components: miri
      - run: cargo +nightly-2026-11-04 miri test --locked -p relay-protocol --test boundaries
      - run: cargo +nightly-2026-11-04 miri test --locked -p relay-testkit --test counting

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          toolchain: "1.99.1"
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Everything except the GUI (relay-ui, relay-desktop) and benches: no windowing libraries.
  headless:
    name: headless (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          toolchain: "1.99.1"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: headless
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - run: cargo clippy --locked --workspace --exclude relay-ui --exclude relay-desktop --exclude relay-benches --all-targets -- -D warnings
      - run: cargo test --locked --workspace --exclude relay-ui --exclude relay-desktop --exclude relay-benches
      - name: Terminal-only crates have no GUI dependencies
        shell: bash
        run: '! cargo tree --locked -p relay-cli -p relay-daemon | grep -E "eframe|egui|winit"'
      # Bench and neural tooling, so it is built explicitly.
      - run: cargo clippy --locked -p relay-benches --all-targets -- -D warnings
      - run: cargo test --locked -p relay-benches

  # The desktop GUI links windowing libraries, so it is built on its own (relay-ui included).
  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          toolchain: "1.99.1"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev pkg-config libgtk-3-dev
          libxkbcommon-dev libwayland-dev libayatana-appindicator3-dev
      - run: cargo clippy --locked -p relay-desktop -p relay-ui --all-targets -- -D warnings
      - run: cargo test --locked -p relay-desktop -p relay-ui

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features
      - name: cargo deny (Android workspace)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: apps/relay-android/Cargo.toml
          command: check
          arguments: --all-features
      - name: cargo deny (fuzz crate)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: fuzz/Cargo.toml
          command: check
          arguments: --all-features

  # Compile-only check that the fuzz targets still build; it does not fuzz.
  fuzz-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1 branch; toolchain set below
        with:
          toolchain: nightly-2026-11-04
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz
      # rust-toolchain.toml pins stable and overrides the nightly installed above, so name it.
      - run: cargo +nightly-2026-11-04 install cargo-fuzz --version 0.13.2 --locked
      - run: cargo +nightly-2026-11-04 fuzz build
